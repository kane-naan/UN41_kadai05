<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>kadai</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* スマホ表示時にもコインやボタンが隠れないようにスタイルを調整 */
      body {
        margin: 0;
        padding: 0;
        background: #231942; /* 背景色（好みに合わせて変更可） */
        color: #fff;
        font-family: sans-serif;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #coin-display {
        text-align: center;
        font-weight: bold;
        font-size: 20px;
        color: #fff;
        margin: 10px 0;
      }
      #spawn-btn {
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        color: #333;
        background-color: #ffd700;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      }
      #spawn-btn:active {
        transform: scale(0.95);
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <!-- コイン枚数表示 (キャンバスの上に配置) -->
      <div id="coin-display">
        獲得コイン: <span id="coin-count" style="color: #ff2a2a;">0</span> 枚
      </div>

      <!-- SpawnCoinボタン (キャンバスの上に配置) -->
      <div style="text-align: center; margin-bottom: 10px;">
        <button id="spawn-btn">
          コインを生成 (SpawnCoin)
        </button>
      </div>

      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>

      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">My project (5)</div>
      </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      var myUnityInstance = null;

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/webServiceBuild.loader.js";
      var config = {
        dataUrl: buildUrl + "/webServiceBuild.data",
        frameworkUrl: buildUrl + "/webServiceBuild.framework.js",
        codeUrl: buildUrl + "/webServiceBuild.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "My project (5)",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          /* 修正1: 演算子 * と + の記述ミスを修復 */
          progressBarFull.style.width = (100 * progress) + "%";
        }).then((unityInstance) => {
          myUnityInstance = unityInstance;

          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);

      // コイン生成ボタンのクリックイベント
      document.getElementById("spawn-btn").onclick = function() {
        if (myUnityInstance) {
          myUnityInstance.SendMessage("CoinManager", "SpawnCoin");
        } else {
          console.log("Unityのロードが完了していません。");
        }
      };

      // タッチ操作による移動方向の取得とUnity連携
      var moveDirection = { x: 0, y: 0 };
      var isTouching = false;

      canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        isTouching = true;
        updateMoveDirection(e.touches[0]);
      }, { passive: false });

      canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (isTouching) {
          updateMoveDirection(e.touches[0]);
        }
      }, { passive: false });

      function handleTouchEnd(e) {
        e.preventDefault();
        isTouching = false;
        moveDirection = { x: 0, y: 0 };
        sendDirectionToUnity(0, 0);
      }

      canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
      canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

      function updateMoveDirection(touch) {
        var rect = canvas.getBoundingClientRect();
        /* 修正2: 引き算 (-) 記号が抜け落ちていた箇所の修復 */
        var touchX = touch.clientX - rect.left;
        var touchY = touch.clientY - rect.top;

        var centerX = rect.width / 2;
        var centerY = rect.height / 2;

        var dx = touchX - centerX;
        var dy = touchY - centerY;
        var distance = Math.hypot(dx, dy);

        if (distance > 0) {
          moveDirection.x = dx / distance;
          moveDirection.y = -dy / distance;
        } else {
          moveDirection.x = 0;
          moveDirection.y = 0;
        }

        sendDirectionToUnity(moveDirection.x, moveDirection.y);
      }

      function sendDirectionToUnity(x, y) {
        if (myUnityInstance) {
          myUnityInstance.SendMessage("Player", "SetTouchInput", x + "," + y);
        }
      }
    </script>
  </body>
</html>
