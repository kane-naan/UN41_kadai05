<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>kadai</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>

      <!-- コイン枚数表示 -->
      <div id="coin-display" style="text-align: center; font-weight: bold; font-size: 24px; color: #333; margin: 10px 0;">
        獲得コイン: <span id="coin-count" style="color: red;">0</span> 枚
      </div>

      <!-- SpawnCoinボタンの追加 -->
      <div style="text-align: center; margin-bottom: 15px;">
        <button id="spawn-btn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
          コインを生成 (SpawnCoin)
        </button>
      </div>

      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">My project (5)</div>
      </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // Unityインスタンスを保持する変数を定義
      var myUnityInstance = null;

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/webServiceBuild.loader.js";
      var config = {
        dataUrl: buildUrl + "/webServiceBuild.data",
        frameworkUrl: buildUrl + "/webServiceBuild.framework.js",
        codeUrl: buildUrl + "/webServiceBuild.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "My project (5)",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          myUnityInstance = unityInstance;

          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);

      // ボタンが押されたときにUnityへメッセージを送信する処理
      document.getElementById("spawn-btn").onclick = function() {
        if (myUnityInstance) {
          myUnityInstance.SendMessage("CoinManager", "SpawnCoin");
        } else {
          console.log("Unityのロードが完了していません。");
        }
      };

      // -------------------------------------------------------------
      // ★ ここから追記：タッチ操作による移動方向の取得とUnity連携
      // -------------------------------------------------------------
      var moveDirection = { x: 0, y: 0 };
      var isTouching = false;

      // タッチ開始
      canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        isTouching = true;
        updateMoveDirection(e.touches[0]);
      }, { passive: false });

      // タッチ移動
      canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (isTouching) {
          updateMoveDirection(e.touches[0]);
        }
      }, { passive: false });

      // タッチ終了
      function handleTouchEnd(e) {
        e.preventDefault();
        isTouching = false;
        moveDirection = { x: 0, y: 0 };
        sendDirectionToUnity(0, 0); // 指を離したら停止
      }

      canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
      canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

      // タッチ位置とキャンバス中心の差分から移動方向（正規化）を求める
      function updateMoveDirection(touch) {
        var rect = canvas.getBoundingClientRect();
        var touchX = touch.clientX - rect.left;
        var touchY = touch.clientY - rect.top;

        var centerX = rect.width / 2;
        var centerY = rect.height / 2;

        var dx = touchX - centerX;
        var dy = touchY - centerY;
        var distance = Math.hypot(dx, dy);

        if (distance > 0) {
          // Y軸は画面座標（下がプラス）と3D空間（奥がプラス）で反転するため -dy にします
          moveDirection.x = dx / distance;
          moveDirection.y = -dy / distance;
        } else {
          moveDirection.x = 0;
          moveDirection.y = 0;
        }

        // Unityに移動方向データを送信
        sendDirectionToUnity(moveDirection.x, moveDirection.y);
      }

      // Unity側のスクリプトに「X,Y」を文字列として送る関数
      function sendDirectionToUnity(x, y) {
        if (myUnityInstance) {
          // ※例: Playerオブジェクトの SetTouchInput メソッドを呼び出す場合
          myUnityInstance.SendMessage("Player", "SetTouchInput", x + "," + y);
        }
      }

    </script>
  </body>
</html>
